   name: Build Windows
   on: [push, workflow_dispatch]
   jobs:
     windows:
       runs-on: windows-2022
       steps:
         - uses: actions/checkout@v4
         - name: Configure
           run: cmake --preset windows-x64
         - name: Build
           run: cmake --build build_x64 --config RelWithDebInfo
         - name: Package
           run: cmake --install build_x64 --config RelWithDebInfo --prefix release
         - uses: actions/upload-artifact@v4
           with:
             name: realm-killsense-windows-x64
             path: release
